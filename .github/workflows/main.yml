name: RDP Web (noVNC for ChromeOS)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall delete rule name="noVNC-Web"

          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="noVNC-Web" dir=in action=allow protocol=TCP localport=6080

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword +=$charSet.Upper | Get-Random -Count 4
          $rawPassword +=$charSet.Lower | Get-Random -Count 4
          $rawPassword +=$charSet.Number | Get-Random -Count 4
          $rawPassword +=$charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile$installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID$tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install and Setup Web-VNC Gateway (noVNC)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          
          # Instalar UltraVNC y Python para el puente Web
          choco install ultravnc python3 -y --no-progress
          
          # Configurar UltraVNC como Servicio
          $vncPath = "C:\Program Files\uvnc bvba\UltraVNC"
          Start-Process -FilePath "$vncPath\winvnc.exe" -ArgumentList "-install" -Wait
          Start-Service -Name "uvnc_service" -ErrorAction SilentlyContinue

          # Descargar noVNC y Websockify
          pip install numpy websockify
          git clone https://github.com/novnc/noVNC.git C:\noVNC

          # Iniciar Websockify en segundo plano para convertir VNC (5900) a WebSockets HTTP (6080)
          Start-Process python -ArgumentList "-m websockify --web C:\noVNC 6080 localhost:5900" -WindowStyle Hidden

      - name: Maintain Connection
        run: |
          $webUrl = "http://$($env:TAILSCALE_IP):6080/vnc.html"
          Write-Host "`n======================================================`n" -ForegroundColor Green
          Write-Host " ACCESO WEB PARA CHROMEOS LISTO" -ForegroundColor Yellow
          Write-Host " URL DIRECTA EN CHROME: $webUrl" -ForegroundColor Cyan
          Write-Host " Usuario RDP: Skyro"
          Write-Host " Password RDP: $env:RDP_PASS"
          Write-Host "`n======================================================`n" -ForegroundColor Green
          
          while ($true) {
              Write-Host "[$(Get-Date)] Servidor Web Activo - Abre la URL en Chrome"
              Start-Sleep -Seconds 300
          }
