name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          sc query TermService | find "RUNNING" >nul || net start TermService
          exit /b 0

      - name: Generate Random Password and Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

          Write-Host "======================================================"
          Write-Host " CONTRASENA GENERADA: $password"
          Write-Host "======================================================"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          Write-Host "Usuario Skyro creado correctamente."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-runner-$env:GITHUB_RUN_ID" --authkey="${{ secrets.TAILSCALE_AUTHKEY }}"

      - name: Show RDP Connection Info and Maintain
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "======================================================"
          Write-Host " RDP LISTO - DATOS DE CONEXION"
          Write-Host "======================================================"
          Write-Host " Host / IP   : $tsIP"
          Write-Host " Port        : 3389"
          Write-Host " Usuario     : Skyro"
          Write-Host " Contrasena  : $env:RDP_PASS"
          Write-Host ""
          Write-Host " URI RDP directo:"
          Write-Host "   rdp://$tsIP:3389"
          Write-Host ""
          Write-Host " Comando mstsc:"
          Write-Host "   mstsc /v:$tsIP:3389"
          Write-Host "======================================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP activo en $tsIP"
              Start-Sleep -Seconds 300
          }
