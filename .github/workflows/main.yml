name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          sc query TermService | find "RUNNING" >nul || net start TermService
          exit /b 0

      - name: Generate Random Password and Create RDP User
        shell: powershell
        run: |
          # Generar contrasena aleatoria de 20 caracteres
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(20, 4)

          # Guardar en variable de entorno para los siguientes pasos
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

          # Mostrar en el log
          Write-Host "======================================================"
          Write-Host " CONTRASENA GENERADA: $password"
          Write-Host "======================================================"

          # Crear usuario con la contrasena aleatoria
          net user Skyro "$password" /add /expires:never
          net localgroup Administrators Skyro /add
          net localgroup "Remote Desktop Users" Skyro /add

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "`n------------------------------------------------------"
          Write-Host "CONECTANDO TAILSCALE..."
          Write-Host "------------------------------------------------------`n"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-runner-$env:GITHUB_RUN_ID" --authkey="${{ secrets.TAILSCALE_AUTHKEY }}"

      - name: Show Connection Info and Maintain
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "`n======================================================"
          Write-Host " CONEXION RDP ESTABLECIDA"
          Write-Host "======================================================"
          Write-Host " Tailscale IP : $tsIP"
          Write-Host " Usuario      : Skyro"
          Write-Host " Contrasena   : $env:RDP_PASS"
          Write-Host "======================================================`n"
          Write-Host "Copia la IP y la contrasena a tu extension RDP."
          Write-Host "La maquina se mantendra activa hasta el timeout (6 horas).`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Activo - IP: $tsIP"
              Start-Sleep -Seconds 300
          }
