name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    defaults:
      run:
        shell: powershell

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          net user Skyro "P@ssw0rdSkyro2026!" /add /expires:never
          net localgroup Administrators Skyro /add /ErrorAction SilentlyContinue
          net localgroup "Remote Desktop Users" Skyro /add /ErrorAction SilentlyContinue
          
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASS=P@ssw0rdSkyro2026!"

      - name: Install Tailscale
        run: |
          curl.exe -L -o "$env:TEMP\tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        run: |
          Write-Host "`n------------------------------------------------------"
          Write-Host "INICIANDO AUTENTICACIÓN INTERACTIVA DE TAILSCALE"
          Write-Host "Abre el enlace de abajo para conectar tu cuenta."
          Write-Host "------------------------------------------------------`n"

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-runner-$env:GITHUB_RUN_ID"

      - name: Maintain Connection
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "`n======================================================`n"
          Write-Host " TAILSCALE IP CONECTADA: $tsIP"
          Write-Host " USUARIO: Skyro"
          Write-Host " CONTRASEÑA: $env:RDP_PASS"
          Write-Host "`n======================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Servidor RDP activo en IP:$tsIP"
              Start-Sleep -Seconds 300
          }
