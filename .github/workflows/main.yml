name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    defaults:
      run:
        shell: powershell

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $Computer = [ADSI]"WinNT://$env:COMPUTERNAME"
          $User =$Computer.Create("User", "Skyro")
          $User.SetPassword("P@ssw0rdSkyro2026!")
          $User.SetInfo()
          
          $Group1 = [ADSI]"WinNT://$env:COMPUTERNAME/Administrators,group"
          $Group1.Add("WinNT://$env:COMPUTERNAME/Skyro")
          
          $Group2 = [ADSI]"WinNT://$env:COMPUTERNAME/Remote Desktop Users,group"
          $Group2.Add("WinNT://$env:COMPUTERNAME/Skyro")

      - name: Install Tailscale
        run: |
          curl.exe -L -o "$env:TEMP\tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        run: |
          Write-Host "`n------------------------------------------------------"
          Write-Host "INICIANDO AUTENTICACIÓN INTERACTIVA DE TAILSCALE"
          Write-Host "Abre el enlace que aparecerá abajo para iniciar sesión."
          Write-Host "------------------------------------------------------`n"

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-runner-$env:GITHUB_RUN_ID"

      - name: Maintain Connection
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "`n======================================================`n"
          Write-Host " TAILSCALE IP CONECTADA: $tsIP"
          Write-Host " USUARIO: Skyro"
          Write-Host " CONTRASEÑA: P@ssw0rdSkyro2026!"
          Write-Host "`n======================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Servidor RDP activo en IP:$tsIP"
              Start-Sleep -Seconds 300
          }
