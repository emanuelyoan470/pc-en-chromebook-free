name: RDP con Guacamole Web

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          sc query TermService | find "RUNNING" >nul || net start TermService
          exit /b 0

      - name: Generate Random Password and Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

          Write-Host "======================================================"
          Write-Host " CONTRASENA GENERADA: $password"
          Write-Host "======================================================"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          Write-Host "Usuario Skyro creado."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-runner-$env:GITHUB_RUN_ID" --authkey="${{ secrets.TAILSCALE_AUTHKEY }}"

      - name: Install WSL and Docker (para Guacamole)
        shell: powershell
        run: |
          # Instalar WSL2
          wsl --install --no-distribution
          wsl --set-default-version 2
          # Instalar Ubuntu
          wsl --install -d Ubuntu --no-launch
          Start-Sleep -Seconds 30
          # Instalar Docker dentro de WSL
          wsl -d Ubuntu -- bash -c "sudo apt update && sudo apt install -y docker.io"
          Write-Host "WSL y Docker instalados."

      - name: Start Guacamole in Docker (WSL)
        shell: powershell
        run: |
          $guacCmd = @'
sudo docker run -d --name guacd --restart=always -p 4822:4822 guacamole/guacd
sudo docker run -d --name guacamole --restart=always --link guacd:guacd -p 8080:8080 -e GUACD_HOSTNAME=guacd -e EXTENSIONS=auth-quickconnect guacamole/guacamole
'@
          $guacCmd | Out-File -FilePath "$env:TEMP\start_guac.sh" -Encoding ASCII
          wsl -d Ubuntu -- bash /mnt/c/Users/runneradmin/AppData/Local/Temp/start_guac.sh
          Start-Sleep -Seconds 20
          wsl -d Ubuntu -- docker ps
          Write-Host "Guacamole iniciado en puerto 8080."

      - name: Show Connection Info and Maintain
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "`n======================================================"
          Write-Host " CONEXION LISTA"
          Write-Host "======================================================"
          Write-Host " Tailscale IP : $tsIP"
          Write-Host " Usuario RDP  : Skyro"
          Write-Host " Contrasena   : $env:RDP_PASS"
          Write-Host ""
          Write-Host " CLIENTE WEB (Guacamole):"
          Write-Host "   http://${tsIP}:8080/guacamole/"
          Write-Host "   Login: guacadmin / guacadmin"
          Write-Host ""
          Write-Host " Despues de entrar, agrega conexion RDP:"
          Write-Host "   Hostname: localhost"
          Write-Host "   Port: 3389"
          Write-Host "   User: Skyro"
          Write-Host "   Pass: $env:RDP_PASS"
          Write-Host "======================================================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Activo - IP: $tsIP"
              Start-Sleep -Seconds 300
          }
