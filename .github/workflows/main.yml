name: RDP con Guacamole HTTPS

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          sc query TermService | find "RUNNING" >nul || net start TermService
          exit /b 0

      - name: Generate Password and Create User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "CONTRASENA: $password"
          $sec = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $sec -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname="gh-rdp" --authkey="${{ secrets.TAILSCALE_AUTHKEY }}"
          Start-Sleep -Seconds 15
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Enable HTTPS in Tailscale
        shell: powershell
        run: |
          # Habilitar HTTPS y MagicDNS en el tailnet (necesario para tailscale serve)
          & "$env:ProgramFiles\Tailscale\tailscale.exe" cert --help > $null 2>&1
          Write-Host "Tailscale listo para serve"

      - name: Setup WSL2
        shell: powershell
        run: |
          wsl --install --no-distribution
          wsl --set-default-version 2
          wsl --update
          Start-Sleep -Seconds 30

      - name: Install Ubuntu in WSL
        shell: powershell
        run: |
          wsl --install -d Ubuntu --no-launch
          Start-Sleep -Seconds 90
          wsl -d Ubuntu -- echo "Ubuntu listo"

      - name: Install Docker in WSL Ubuntu
        shell: powershell
        run: |
          wsl -d Ubuntu -u root -- bash -c "apt-get update && apt-get install -y docker.io"
          Start-Sleep -Seconds 15
          wsl -d Ubuntu -u root -- docker --version

      - name: Start Guacamole Containers
        shell: powershell
        run: |
          wsl -d Ubuntu -u root -- bash -c "docker run -d --name guacd --restart=always -p 4822:4822 guacamole/guacd"
          Start-Sleep -Seconds 20
          wsl -d Ubuntu -u root -- bash -c "docker run -d --name guacamole --restart=always -p 8080:8080 --link guacd:guacd -e GUACD_HOSTNAME=guacd guacamole/guacamole"
          Start-Sleep -Seconds 30
          wsl -d Ubuntu -u root -- docker ps

      - name: Port Forward Windows to WSL
        shell: powershell
        run: |
          # Obtener IP interna de WSL
          $wslIP = (wsl -d Ubuntu hostname -I).Trim().Split()[0]
          Write-Host "WSL IP: $wslIP"

          # Redirigir puerto 8080 de Windows a WSL
          netsh interface portproxy add v4tov4 listenaddress=0.0.0.0 listenport=8080 connectaddress=$wslIP connectport=8080

          # Verificar
          netsh interface portproxy show all

          # Probar localmente
          Start-Sleep -Seconds 5
          try {
            $test = Invoke-WebRequest -Uri "http://localhost:8080/guacamole/" -UseBasicParsing -TimeoutSec 10
            Write-Host "Prueba local OK: HTTP $($test.StatusCode)"
          } catch {
            Write-Host "Prueba local fallo: $_"
          }

      - name: Setup Tailscale Serve (HTTPS Proxy)
        shell: powershell
        run: |
          # Configurar tailscale serve para exponer localhost:8080 via HTTPS
          & "$env:ProgramFiles\Tailscale\tailscale.exe" serve --bg --https=443 http://localhost:8080
          Start-Sleep -Seconds 10

          # Obtener el nombre DNS de Tailscale
          $tsName = (& "$env:ProgramFiles\Tailscale\tailscale.exe" status --json | ConvertFrom-Json).Self.DNSName
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "======================================================"
          Write-Host " GUACAMOLE HTTPS LISTO"
          Write-Host "======================================================"
          Write-Host " URL HTTPS    : https://$tsName"
          Write-Host " URL HTTP     : http://${tsIP}:8080/guacamole/"
          Write-Host " Login        : guacadmin / guacadmin"
          Write-Host ""
          Write-Host " RDP para agregar en Guacamole:"
          Write-Host "   Host: localhost"
          Write-Host "   Port: 3389"
          Write-Host "   User: Skyro"
          Write-Host "   Pass: $env:RDP_PASS"
          Write-Host "======================================================"

          # Guardar nombre DNS en env
          echo "TS_NAME=$tsName" >> $env:GITHUB_ENV

      - name: Show Info and Maintain
        shell: powershell
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          $tsName = (& "$env:ProgramFiles\Tailscale\tailscale.exe" status --json | ConvertFrom-Json).Self.DNSName

          Write-Host ""
          Write-Host "======================================================"
          Write-Host " ACCESO A GUACAMOLE"
          Write-Host "======================================================"
          Write-Host " HTTPS: https://$tsName"
          Write-Host " HTTP : http://${tsIP}:8080/guacamole/"
          Write-Host " Login: guacadmin / guacadmin"
          Write-Host ""
          Write-Host " RDP:"
          Write-Host "   Host: localhost"
          Write-Host "   Port: 3389"
          Write-Host "   User: Skyro"
          Write-Host "   Pass: $env:RDP_PASS"
          Write-Host "======================================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] Activo - HTTPS: https://$tsName"
              Start-Sleep -Seconds 300
          }
